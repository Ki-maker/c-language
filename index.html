<!doctype html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>YouTube 字幕検索</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <main class="page-shell">
        <section class="hero">
            <p class="eyebrow">YOUTUBE TRANSCRIPT SEARCH</p>
            <h1>YouTube 字幕検索</h1>
            <p class="description">動画の字幕から、探したい言葉を見つけます。</p>
        </section>
        <section class="search-panel">
            <form action="/search" method="get">
                <label for="keyword">検索キーワード</label>
                <div class="search-row">
                    <input id="keyword" name="keyword" type="search" placeholder="例: C言語">
                    <input id="sort-order" name="sort_order" type="hidden" value="1">
                    <button type="submit">検索</button>
                </div>
                <p>{{message}}</p>
            </form>
            <section class="sort-panel" aria-labelledby="sort-heading">
                <div class="sort-heading-row">
                    <h2 id="sort-heading">並び順</h2>
                    <span id="sort-status" aria-live="polite">人気度</span>
                </div>
                <div class="sort-options" role="group" aria-label="検索結果の並び順">
                    <button type="button" class="sort-option is-selected" data-sort="popularity">人気度</button>
                    <button type="button" class="sort-option" data-sort="like-rate">高評価率</button>
                    <button type="button" class="sort-option" data-sort="comments">コメント活発度</button>
                    <button type="button" class="sort-option" data-sort="trending">急上昇</button>
                    <button type="button" class="sort-option" data-sort="subscribers">チャンネル登録者が多い</button>
                    <button type="button" class="sort-option" data-sort="efficiency">タイパがいい</button>
                    <button type="button" class="sort-option" data-sort="underrated">知名度低いが人気</button>
                </div>
            </section>
            <script id="initial-results" type="application/json">{{api_res_data}}</script>
            <div id="results" class="results"></div>
        </section>
    </main>
    <script>
        (() => {
            const results = document.getElementById("results");
            const initialResults = document.getElementById("initial-results");
            const buttons = document.querySelectorAll(".sort-option");
            const status = document.getElementById("sort-status");
            const sortOrder = document.getElementById("sort-order");
            const keywordInput = document.getElementById("keyword");
            let videos;

            if (keywordInput !== null) {
                keywordInput.value = new URLSearchParams(window.location.search).get("keyword") || "";
            }

            try {
                videos = JSON.parse(initialResults === null ? "[]" : initialResults.textContent.trim() || "[]");
            } catch (error) {
                if (initialResults !== null) initialResults.remove();
                results.textContent = "検索結果を読み込めませんでした。";
                return;
            }
            if (initialResults !== null) initialResults.remove();
            if (!Array.isArray(videos)) return;

            const number = (video, key) => Number(video[key]) || 0;
            const durationSeconds = (video) => {
                const value = video.videoTime;
                if (typeof value === "number") return value;
                if (typeof value !== "string") return 0;
                const match = value.match(/^PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?$/);
                if (!match) return 0;
                return (Number(match[1]) || 0) * 3600 +
                    (Number(match[2]) || 0) * 60 + (Number(match[3]) || 0);
            };
            const score = (video, sort) => {
                const views = number(video, "viewCount");
                const likes = number(video, "likeCount");
                const comments = number(video, "commentCount");
                const duration = durationSeconds(video);
                if (sort === "like-rate") return views > 0 ? likes / views : 0;
                if (sort === "comments") return views > 0 ? comments / views : 0;
                if (sort === "trending") return likes + comments * 3;
                if (sort === "subscribers") return number(video, "subscriberCount");
                if (sort === "efficiency") return duration > 0 ? views / duration : 0;
                if (sort === "underrated") return views > 0 ? likes / Math.sqrt(views) : 0;
                return views;
            };

            const formatDuration = (video) => {
                const totalSeconds = durationSeconds(video);
                const hours = Math.floor(totalSeconds / 3600);
                const minutes = Math.floor((totalSeconds % 3600) / 60);
                const seconds = totalSeconds % 60;
                if (hours > 0) return `${hours}:${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
                return `${minutes}:${String(seconds).padStart(2, "0")}`;
            };

            const renderVideos = () => {
                results.replaceChildren();
                videos.forEach((video) => {
                    const card = document.createElement("article");
                    const image = document.createElement("img");
                    const details = document.createElement("div");
                    const title = document.createElement("h3");
                    const channel = document.createElement("div");
                    const duration = document.createElement("div");
                    const views = document.createElement("div");
                    const published = document.createElement("div");
                    const imageUrl = video.image && (video.image.large || video.image.middle);
                    const videoUrl = `https://www.youtube.com/watch?v=${encodeURIComponent(video.videoId || "")}`;

                    card.className = "video-card";
                    card.tabIndex = 0;
                    card.setAttribute("role", "link");
                    card.setAttribute("aria-label", `${video.title || "動画"}をYouTubeで開く`);
                    card.addEventListener("click", () => window.open(videoUrl, "_blank", "noopener,noreferrer"));
                    card.addEventListener("keydown", (event) => {
                        if (event.key === "Enter" || event.key === " ") {
                            event.preventDefault();
                            window.open(videoUrl, "_blank", "noopener,noreferrer");
                        }
                    });
                    image.className = "video-image";
                    image.src = imageUrl || "";
                    image.alt = video.title || "動画サムネイル";
                    image.loading = "lazy";
                    details.className = "video-details";
                    title.textContent = video.title || "タイトルなし";
                    channel.className = "video-meta";
                    channel.textContent = `2. チャンネル名  ${video.channelName || "不明"}`;
                    duration.className = "video-meta";
                    duration.textContent = `3. 再生時間  ${formatDuration(video)}`;
                    views.className = "video-meta";
                    views.textContent = `4. 再生数  ${number(video, "viewCount").toLocaleString("ja-JP")}`;
                    published.className = "video-meta";
                    published.textContent = `5. 公開日  ${video.publishedAt || "不明"}`;
                    details.append(title, channel, duration, views, published);
                    card.append(image, details);
                    results.append(card);
                });
            };

            renderVideos();

            buttons.forEach((button, index) => {
                button.addEventListener("click", () => {
                    buttons.forEach((item) => item.classList.remove("is-selected"));
                    button.classList.add("is-selected");
                    videos.sort((left, right) => score(right, button.dataset.sort) - score(left, button.dataset.sort));
                    renderVideos();
                    status.textContent = button.textContent;
                    sortOrder.value = String(index + 1);
                });
            });
        })();
    </script>
</body>
</html>
