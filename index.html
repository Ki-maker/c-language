<!doctype html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>YouTube 字幕検索</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <main class="page-shell">
        <section class="hero">
            <p class="eyebrow">YOUTUBE TRANSCRIPT SEARCH</p>
            <h1>YouTube 字幕検索</h1>
            <p class="description">動画の字幕から、探したい言葉を見つけます。</p>
        </section>
        <section class="search-panel">
            <form action="/search" method="get">
                <label for="keyword">検索キーワード</label>
                <div class="search-row">
                    <input id="keyword" name="keyword" type="search" placeholder="例: C言語">
                    <button type="submit">検索</button>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
